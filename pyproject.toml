[project]
name = "numpyandpytorch"
version = "0.1.0"
description = "Educational comparison of Python, NumPy, and PyTorch for neural network implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = []